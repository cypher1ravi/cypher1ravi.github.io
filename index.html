<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FinTrack</title>
<meta name="description" content="FinTrack: a private expense tracker and ledger for Android.">
<style>
  :root {
    --bg: #EEF5F0; --surface: #FFFFFF; --ink: #10231A; --muted: #4F6359;
    --rule: #E2ECE5; --brand: #0F5A3F; --on-brand: #FFFFFF;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0B1712; --surface: #12211A; --ink: #E7F0EA; --muted: #A9BDB2; --rule: #22362C; --brand: #6EE7A0; --on-brand: #0B1712; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--bg); color: var(--ink);
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main {
    max-width: 560px; margin: 16px; padding: 32px 24px; text-align: center;
    background: var(--surface); border: 1px solid var(--rule); border-radius: 24px;
  }
  h1 { font-size: 34px; margin: 0 0 6px; letter-spacing: -0.5px; }
  .tag { color: var(--muted); margin: 0 0 20px; }
  ul { text-align: left; display: inline-block; margin: 0 0 24px; padding-left: 22px; }
  li { margin: 4px 0; }
  .links { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  a.button {
    display: inline-block; padding: 10px 18px; border-radius: 14px; text-decoration: none;
    background: var(--brand); color: var(--on-brand); font-weight: 600;
  }
  a.plain { color: var(--brand); padding: 10px 4px; }
</style>
</head>
<body>
<main>
  <h1>FinTrack</h1>
  <p class="tag">Track &middot; Manage &middot; Grow</p>
  <ul>
    <li>Record income and expenses with budgets and charts</li>
    <li>Import transactions from bank SMS, processed on your phone</li>
    <li>Keep a ledger of money you lend and borrow</li>
    <li>Your data stays on your device</li>
  </ul>
  <div class="links">
    <a class="button" href="fintrack/privacy-policy.html">Privacy Policy</a>
    <a class="plain" href="mailto:ravindrachaubey410@gmail.com">Contact</a>
  </div>
</main>
</body>
</html>
